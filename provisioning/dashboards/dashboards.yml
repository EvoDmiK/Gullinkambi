apiVersion: 1

providers:
  - name: Hermes Kanban
    orgId: 1
    folder: Hermes
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/hermes-kanban
  - name: Mac mini
    orgId: 1
    folder: Mac mini
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/macmini
  - name: OpenViking
    orgId: 1
    folder: Agents
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/openviking
