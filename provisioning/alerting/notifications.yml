apiVersion: 1

templates:
  - orgId: 1
    name: Gullinkambi Discord card
    template: |
      {{ define "gullinkambi.discord.title" -}}
      {{- if gt (len .Alerts.Firing) 0 -}}
      🚨 [FIRING] Gullinkambi Grafana 알림
      {{- else -}}
      ✅ [RESOLVED] Gullinkambi Grafana 알림
      {{- end -}}
      {{- end }}

      {{ define "gullinkambi.discord.alerts" -}}
      {{- range . }}
      • {{ with index .Annotations "summary" }}{{ . }}{{ else }}{{ index .Labels "alertname" }}{{ end }}
      {{- end }}
      {{- end }}

      {{ define "gullinkambi.discord.message" -}}
      **{{ with index .CommonLabels "alertname" }}{{ . }}{{ else }}Grafana alert{{ end }}**
      {{ with index .CommonAnnotations "description" }}{{ . }}

      {{ end -}}
      {{- if gt (len .Alerts.Firing) 0 }}
      **발생 · {{ len .Alerts.Firing }}건**
      {{ template "gullinkambi.discord.alerts" .Alerts.Firing }}
      {{ end -}}
      {{- if gt (len .Alerts.Resolved) 0 }}
      **복구 · {{ len .Alerts.Resolved }}건**
      {{ template "gullinkambi.discord.alerts" .Alerts.Resolved }}
      {{ end -}}
      {{- with index .Alerts 0 }}

      {{ if .GeneratorURL }}[Source]({{ .GeneratorURL }}){{ end }}{{ if .SilenceURL }} · [Silence]({{ .SilenceURL }}){{ end }}{{ if .DashboardURL }} · [Dashboard]({{ .DashboardURL }}){{ end }}{{ if .PanelURL }} · [Panel]({{ .PanelURL }}){{ end }}
      {{- end }}
      {{- end }}

contactPoints:
  - orgId: 1
    name: Gullinkambi Discord
    receivers:
      - uid: gk_discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $GF_DISCORD_WEBHOOK_URL
          use_discord_username: false
          use_embed_description: true
          title: '{{ template "gullinkambi.discord.title" . }}'
          message: |
            {{ template "gullinkambi.discord.message" . }}

policies:
  - orgId: 1
    receiver: Gullinkambi Discord
    group_by:
      - alertname
      - service
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Weekly quota tiers notify once when crossed; the next tier or the weekly reset sends the next card.
      - receiver: Gullinkambi Discord
        object_matchers:
          - ['alertname', '=', 'AI weekly quota high']
        repeat_interval: 168h
