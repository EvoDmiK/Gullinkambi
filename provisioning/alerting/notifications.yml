apiVersion: 1

contactPoints:
  - orgId: 1
    name: Gullinkambi Discord
    receivers:
      - uid: gk_discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $GF_DISCORD_WEBHOOK_URL
          use_discord_username: false
          message: |
            {{ template "default.message" . }}

policies:
  - orgId: 1
    receiver: Gullinkambi Discord
    group_by:
      - alertname
      - service
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
